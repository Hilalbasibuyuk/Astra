services:

  postgres:
    image: postgres:16
    container_name: astra-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: astra
      POSTGRES_USER: astra
      POSTGRES_PASSWORD: astra

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U astra -d astra"]
      interval: 5s
      timeout: 5s
      retries: 5


  questdb:
    image: questdb/questdb:9.1.1
    container_name: astra-questdb
    restart: unless-stopped

    ports:
      - "9000:9000"
      - "8812:8812"
      - "9009:9009"

    volumes:
      - questdb_data:/var/lib/questdb

    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:9000/status || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5


volumes:
  postgres_data:
  questdb_data: